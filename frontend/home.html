<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>Eye Tracker + Header</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Roboto|Source+Code+Pro" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="www/css/style.css">
  <link rel="stylesheet" href="styles/home.css">
  <style>
    body {
      background-color: #1d1e27;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1040;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    navbar {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .navbar-left {
      display: flex;
      align-items: center;
    }

    .navbar-right {
      display: flex;
      gap: 10px;
    }


    .custom-icon {
      width: 18px;
      height: 18px;
    }

    #webgazerNavbar {
      background-color: #2c3e50 !important;
      position: fixed;
      top: 90px;
      left: 0;
      width: 100%;
      padding: .5rem 1rem;
      border: none !important;
      box-shadow: none !important;
      z-index: 1038;
      display: none !important;
    }

    #webgazerNavbar .navbar-brand,
    #webgazerNavbar .nav-link,
    #webgazerNavbar .btn {
      color: #ecf0f1 !important;
    }

    #webgazerVideoContainer {
      pointer-events: none !important;
    }

    #webgazerVideoFeed,
    .webgazerVideoCanvas,
    #webgazerFaceFeedbackBox,
    #webgazerFaceOverlay,
    #webgazerDot {
      display: none !important;
    }

    #heatmapImage,
    #heatmapVideo {
      max-width: 800px;
      height: 600px;
      object-fit: cover;
      display: block;
    }

    #heatmapVideo {
      display: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    header h1 {
      margin: 0;
    }

    #heatmapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      height: 600px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }

    #heatmapCanvas.ready {
      opacity: 1;
    }

    .media-container {
      position: relative;
      display: inline-block;
      width: 800px;
      height: 600px;
    }

    .modal-backdrop.show {
      opacity: 0 !important;
      background-color: rgba(29, 30, 39, 0.8) !important;
    }

    .modal,
    .modal-content {
      background: #1d1e27 !important;
      color: #ecf0f1 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .modal-header,
    .modal-body,
    .modal-footer {
      background: inherit !important;
      padding: 0 !important;

    }

    #heatmapModal .modal-dialog {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      max-width: 800px;
    }

    .calibrationDiv {
      gap: 8px;
      margin-top: 150px;
    }

    #heatmapModal .modal-footer .btn {
      min-width: 120px;
    }

    #heatmapModal .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: .5rem;
    }

    #heatmapModal .modal-footer .btn {
      flex: 1;
      text-align: center;
    }

    .sidebar-link {
      background: none;
      border: none;
      color: var(--main-color);
      font-size: 1.1rem;
      font-weight: 200;
      cursor: pointer;
      padding: 0;
      margin: 0;
      text-align: left;
      width: 100%;
      transition: 0.4s all ease-in-out;
    }

    .sidebar-link:hover {
      text-decoration: underline;
    }

    .sidebar ul {
      transform: translateX(-45px);
    }

    .sidebar-footer {
      transform: translateX(-45px);
    }
  </style>
  <script src="www/webgazer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simpleheat@0.4.0/simpleheat.min.js"></script>
</head>

<body>
  <div class="progress"></div>
  <header>
    <div class="header-text-content">
      <h1>
        VIDE<span id="letter-o">O</span>
        <span id="recording">
          <img src="public/record.png" height="50" width="50" alt="recording" id="recording-button">
        </span>
        <div class="pause-icon"></div>
        SCOP
      </h1>
      <navbar>
        <button id="player" style="color:#e8162e;cursor:pointer;font-family:'Wix Madefor Display',sans-serif;">
          SESSIONS
        </button>
    </div>
    <div class="navbar-right">
    </div>
    </navbar>
    <div class="settings">
      <button style="background-color:transparent" id="settings-btn">
        <img src="public/settings.svg" alt="settings" id="settings-img" height="55" width="55">
      </button>
    </div>
  </header>
  <div class="sidebar">
    <button class="remove-sidebar">
      <svg class="custom-icon" viewBox="0 0 477.175 477.175">
        <path fill="#fff"
          d="M360.731 229.075l-225.1-225.1c-5.3-5.3-13.8-5.3-19.1 0s-5.3 13.8 0 19.1l215.5 215.5-215.5 215.5c-5.3 5.3-5.3 13.8 0 19.1 2.6 2.6 6.1 4 9.5 4s6.9-1.3 9.5-4l225.1-225.1c5.2-5.2 5.2-13.8 0-19z" />
      </svg>
    </button>
    <ul>
      <li id="exit">CHANGE PROFILE</li>
      <li class="hide-eye">
        <a href="#">HIDE VIEW DOT</a>
        <input type="checkbox" id="hide-eye-checkbox">
      </li>
      <li>
        <button type="button" class="sidebar-link" onclick="Restart()">Recalibrate</button>
      </li>
    </ul>
    <div class="sidebar-footer">
      <li><a href="#">CONTACTS</a></li>
      <li><a href="#">POLITICS</a></li>
      <li><a href="#">ABOUT US</a></li>
    </div>
  </div>

  <div class="webcam-container">
    <h3 class="camera-status" id="camera-status">checking...</h3>
    <div class="video-upload">
      <button type="button" data-bs-toggle="modal" data-bs-target="#heatmapModal">Upload file
      </button>
      <svg style="color: #fff" class="fas fa-upload" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </div>
  </div>
  <canvas id="plotting_canvas" width="500" height="500" style="cursor:crosshair;"></canvas>
  <nav id="webgazerNavbar" class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <div class="collapse navbar-collapse" id="webgazerNavContent">
        <ul class="navbar-nav me-auto">
          <li class="nav-item d-none" id="Accuracy">
            <a class="nav-link" href="#">Not yet Calibrated</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="modal fade" id="heatmapModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body text-center">
          <div class="mb-3">
            <input type="file" id="heatmapUpload" accept="image/*,video/*" class="form-control">
          </div>
          <div class="media-container">
            <img id="heatmapImage" src="public/Firefly_Создай минималистичный логотип для компании Videoscop.png"
              alt="Heatmap Image">
            <video id="heatmapVideo" controls></video>
            <canvas id="heatmapCanvas"></canvas>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="saveHeatmap">Save Heatmap</button>
          <button type="button" class="btn btn-info" id="replayHeatmap">Replay Heatmap</button>
          <button type="button" class="btn btn-danger d-none" id="stopReplayHeatmap">Stop Replay</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <div class="calibrationDiv d-flex flex-wrap justify-content-center mt-5">
    <input type="button" class="Calibration" id="Pt1">
    <input type="button" class="Calibration" id="Pt2">
    <input type="button" class="Calibration" id="Pt3">
    <input type="button" class="Calibration" id="Pt4">
    <input type="button" class="Calibration" id="Pt5">
    <input type="button" class="Calibration" id="Pt6">
    <input type="button" class="Calibration" id="Pt7">
    <input type="button" class="Calibration" id="Pt8">
    <input type="button" class="Calibration" id="Pt9">
  </div>
  <div id="helpModal" class="modal fade" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body text-center">
          <h5>Калибровка модели</h5>
          <ol class="text-start">
            <li>Прокликайте каждый кружочек по <strong>5 раз</strong>, внимательно наблюдая за ним.</li>
          </ol>
          <p class="fst-italic">Всегда следите глазами за кружком, на который кликаете.</p>
        </div>
        <div class="modal-footer">
          <button id="start_calibration" class="btn btn-primary" data-bs-dismiss="modal" onclick="Restart()">
            Calibrate
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert/dist/sweetalert.min.js"></script>
  <script src="www/js/main.js"></script>
  <script src="www/js/calibration.js"></script>
  <script src="www/js/resize_canvas.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="www/js/heatmap.js"></script>
  <script>
    async function checkCamera() {
      const statusEl = document.getElementById('camera-status');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        statusEl.textContent = 'working';
        statusEl.style.color = "rgb(20, 194, 107)"
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        statusEl.textContent = 'error';
        statusEl.style.color = "red"
        console.error('Camera error:', error);
      }
    }
    checkCamera();
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const hideEyeCheckbox = document.getElementById('hide-eye-checkbox');

      // Простая функция для ожидания элемента
      function waitForGazeDot(callback) {
        const checkElement = () => {
          const gazeDot = document.getElementById('webgazerGazeDot');
          if (gazeDot) {
            callback(gazeDot);
          } else {
            setTimeout(checkElement, 100);
          }
        };
        checkElement();
      }

      // Ждем появления gaze dot и настраиваем управление
      waitForGazeDot((gazeDot) => {
        console.log('Gaze dot found!');

        const updateEyeVisibility = () => {
          gazeDot.style.opacity = hideEyeCheckbox.checked ? '0' : '1';
        };

        hideEyeCheckbox.addEventListener('change', updateEyeVisibility);
        updateEyeVisibility();
      });


      // const calibration = document.querySelector(".Calibration")
      // const plottingCanvas = document.getElementById("plotting_canvas")
      // if (calibration.style.display === "none") {
      //   plottingCanvas.style.display = "none"
      // }
      document.getElementById('player').addEventListener('click', () => {
        window.location.href = 'player.html';
      });
      const sidebar = document.querySelector('.sidebar');
      const settingsBtn = document.getElementById('settings-btn');
      const removeSidebarBtn = document.querySelector('.remove-sidebar');

      settingsBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        document.body.classList.toggle('sidebar-open');
      });

      removeSidebarBtn.addEventListener('click', () => {
        sidebar.classList.remove('open');
        document.body.classList.remove('sidebar-open');
      });
    });
  </script>

</body>

</html>
